name: radar-trendy

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Notificación de prueba (solo al ejecutarlo a mano)
        if: github.event_name == 'workflow_dispatch'
        run: python radar.py --test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Revisar la tienda
        run: python radar.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Guardar estado
        run: |
          git config user.name "radar"
          git config user.email "radar@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "estado del radar" && git push)
